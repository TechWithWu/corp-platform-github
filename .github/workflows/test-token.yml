name: 'Test GitHub App Token Repository Access'

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: '要测试的仓库名称 (例如: corp-platform-foundation)'
        required: true
        default: 'corp-platform-foundation'

jobs:
  test-token:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Generate GitHub App Token'
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CORP_PLATFORM_GITHUB_APP_ID }}
          private-key: ${{ secrets.CORP_PLATFORM_GITHUB_APP_SECRET }}

      - name: 'Test Token Permissions via Pure Curl'
        env:
          APP_TOKEN: ${{ steps.generate-token.outputs.token }}
          OWNER: "corp-techwithwu"  # 强制写死为组织名，排除上下文解析错误
          REPO: ${{ inputs.target_repo }}
        run: |
          echo "检查当前 Token 实际可见的仓库列表..."
          curl -s -H "Authorization: Bearer $APP_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/installation/repositories" > visible_repos.json
          
          echo "当前 Token 视野内的仓库有："
          jq -r '.repositories[].full_name' visible_repos.json