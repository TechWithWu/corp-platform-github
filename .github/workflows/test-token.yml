name: 'Test GitHub App Token Repository Access'

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: '要测试的仓库名称 (例如: corp-platform-foundation)'
        required: true
        default: 'corp-platform-foundation'

jobs:
  test-token:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Generate GitHub App Token'
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CORP_PLATFORM_GITHUB_APP_ID }}
          private-key: ${{ secrets.CORP_PLATFORM_GITHUB_APP_SECRET }}

      - name: 'Test Token Permissions via Pure Curl'
        env:
          APP_TOKEN: ${{ steps.generate-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ inputs.target_repo }}
        run: |
          echo "使用纯 Curl 直接请求 GitHub API..."
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO")
          
          echo "HTTP Status Code: $HTTP_CODE"
          cat response.json
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ 证明通过纯 Token 访问完全成功！之前是 CLI 的上下文或环境变量透传问题。"
          else
            echo "❌ 依然返回非 200 状态码"
            exit 1
          fi